name: Re-sign TUF metadata

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  re-sign:
    name: Re-signer snapshot + timestamp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer tufup
        run: pip install tufup==0.10.0

      - name: Materialiser le trousseau en ligne
        env:
          TUF_KEY_SNAPSHOT: ${{ secrets.TUF_KEY_SNAPSHOT }}
          TUF_KEY_TIMESTAMP: ${{ secrets.TUF_KEY_TIMESTAMP }}
        run: |
          test -n "$TUF_KEY_SNAPSHOT"
          test -n "$TUF_KEY_TIMESTAMP"
          mkdir -p work/repository/metadata work/keystore
          cp .tufup-repo-config work/
          printf '%s' "$TUF_KEY_SNAPSHOT" | base64 -d > work/keystore/snapshot
          printf '%s' "$TUF_KEY_TIMESTAMP" | base64 -d > work/keystore/timestamp
          chmod 600 work/keystore/*

      - name: Reconstruire les métadonnées
        run: gh release download tuf-metadata --pattern '*.json' --dir work/repository/metadata

      - name: Prolonger snapshot et timestamp
        working-directory: work
        run: tufup sign snapshot keystore -e

      - name: Publier les métadonnées renouvelées
        run: gh release upload tuf-metadata work/repository/metadata/*.json --clobber
